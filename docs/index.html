<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line 2 Classes</title>
<meta name="description" content="Every bookable fitness class near the Bloor-Danforth line, with walk times, prices, ClassPass credits and showers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --paper:#f3f5fa; --card:#ffffff; --ink:#141b2d; --muted:#5d6679; --rule:#e2e6ef; --soft:#eef1f7;
  --line:#00853f; --line-ink:#ffffff; --line-soft:#dcf3e6; --amber:#a95f00; --amber-soft:#fff0d6;
  --red:#c0262d; --red-soft:#ffe3e3; --focus:#2563eb; --shadow:0 1px 2px rgba(20,27,45,.06),0 4px 14px rgba(20,27,45,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1119; --card:#161c28; --ink:#e7ebf3; --muted:#9aa4b8; --rule:#273042; --soft:#1d2433;
  --line:#2fbf71; --line-ink:#06120c; --line-soft:#15321f; --amber:#f5b041; --amber-soft:#3a2a10; --red:#ff8a8a; --red-soft:#3b1717; --focus:#7ab4ff;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#0d1119; --card:#161c28; --ink:#e7ebf3; --muted:#9aa4b8; --rule:#273042; --soft:#1d2433;
  --line:#2fbf71; --line-ink:#06120c; --line-soft:#15321f; --amber:#f5b041; --amber-soft:#3a2a10; --red:#ff8a8a; --red-soft:#3b1717; --focus:#7ab4ff;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}

/* ---- header ---- */
header{background:linear-gradient(120deg,#00853f 0%,#00a86b 55%,#0fb5a6 100%);color:#fff}
.hwrap{max-width:1500px;margin:0 auto;padding:14px 16px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font:700 28px/1 "Barlow Condensed",sans-serif;margin:0;display:flex;align-items:center;gap:10px;white-space:nowrap}
h1 .bullet{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;color:#00853f;font-size:21px}
.fresh{font-size:13px;opacity:.9}
.ask{flex:1 1 320px;display:flex}
.ask input{flex:1;min-width:0;padding:11px 14px;border:0;border-radius:12px;background:rgba(255,255,255,.96);color:#141b2d;font-size:16.5px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.ask input::placeholder{color:#6b7385}

/* ---- layout ---- */
.app{max-width:1500px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.side{min-width:0}
.mapcol{position:sticky;top:12px;height:calc(100vh - 24px);margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--rule)}
#map{position:absolute;inset:0;background:var(--soft)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .mapcol{display:none;position:fixed;inset:0;top:0;height:auto;margin:0;border-radius:0;z-index:20;border:0}
  body.showmap .mapcol{display:block}
  body.showmap{overflow:hidden}
}
.viewbtn{display:none}
@media (max-width:900px){
  .viewbtn{display:flex;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;border:0;border-radius:999px;padding:12px 22px;background:#141b2d;color:#fff;font-weight:700;font-size:16px;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
}

/* ---- controls ---- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px 14px;margin-top:12px;box-shadow:var(--shadow)}
.lbl{font:700 12px/1 Barlow;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl button{border:0;background:none;color:var(--focus);font:600 13px Barlow;text-transform:none;letter-spacing:0;cursor:pointer;padding:0}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0 4px}
.row::-webkit-scrollbar{display:none}
.row.wrap{flex-wrap:wrap}
.chip{flex:none;border:1.5px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.day{border-radius:12px;padding:6px 12px;text-align:center;line-height:1.1;min-width:58px}
.day b{display:block;font:700 18px/1.1 "Barlow Condensed",sans-serif}
.day small{font-size:12px;opacity:.75}
.day[aria-pressed="true"]{background:var(--line);border-color:var(--line);color:var(--line-ink)}
.cat{--c:#64748b;border-color:color-mix(in srgb,var(--c) 45%,var(--rule));color:var(--ink)}
.cat .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.cat[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.cat[aria-pressed="true"] .dot{background:#fff}
.sep{border:0;border-top:1px solid var(--rule);margin:10px 0}

/* hour picker */
.hours{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hr{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.hr i{display:block;height:46px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
.hr i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);background:color-mix(in srgb,var(--line) 35%,var(--soft));border-radius:4px 4px 0 0}
.hr span{font:600 11px/1 Barlow;color:var(--muted);text-align:center}
.hr.on i{background:color-mix(in srgb,var(--line) 18%,var(--soft))}
.hr.on i::after{background:var(--line)}
.hr.on span{color:var(--line);font-weight:700}
.presets{margin-top:8px}
.presets .chip{font-size:13.5px;padding:5px 10px}

.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14.5px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opts select{border:1.5px solid var(--rule);border-radius:8px;background:var(--card);padding:4px 6px;color:var(--ink)}
.opts input[type=checkbox]{accent-color:var(--line);width:17px;height:17px}
details.filters>summary{cursor:pointer;font:700 12px/1 Barlow;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none;padding:4px 0}
details.filters>summary::after{content:" ▾"}
details.filters[open]>summary{margin-bottom:10px}

/* ---- results ---- */
main{padding:6px 0 90px}
.summary{font-size:15.5px;color:var(--muted);margin:16px 2px 4px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.summary b{color:var(--ink);font-size:18px}
.active{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--card);border-radius:999px;padding:3px 6px 3px 11px;font-weight:600;font-size:13.5px}
.active button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;padding:0}
.hh{position:sticky;top:0;z-index:3;background:var(--paper);font:700 20px/1 "Barlow Condensed",sans-serif;padding:14px 2px 8px;display:flex;align-items:baseline;gap:8px}
.hh small{font:500 13px Barlow;color:var(--muted)}
@media (max-width:900px){.hh{top:0}}
.cls{--c:#64748b;position:relative;background:var(--card);border:1px solid var(--rule);border-radius:14px;margin-bottom:8px;display:grid;grid-template-columns:70px minmax(0,1fr) auto;box-shadow:var(--shadow);overflow:hidden}
.cls::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cls.sel{outline:2px solid var(--c)}
.when{padding:12px 4px 12px 14px;background:color-mix(in srgb,var(--c) 9%,var(--card))}
.when b{display:block;font:700 24px/1 "Barlow Condensed",sans-serif}
.when small{font:600 12px/1.2 Barlow;color:var(--muted);display:block;margin-top:2px}
.body{padding:11px 12px;min-width:0}
.kind{display:inline-flex;align-items:center;gap:5px;font:700 11.5px/1 Barlow;letter-spacing:.05em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.cls h3{margin:0;font:700 17px/1.2 Barlow,sans-serif}
.venue{margin:2px 0 7px;font-weight:500;color:var(--muted)}
.venue a{text-decoration:none}
.venue a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font:700 14.5px/1 "Barlow Condensed",sans-serif;background:var(--line-soft);color:var(--ink);padding:4px 9px 4px 5px;border-radius:999px;border:0;cursor:pointer}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;font-size:13px}
.tag{border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--muted);font-weight:500}
.tag.good{background:#dbeafe;color:#1d4ed8}
.tag.warn{background:var(--amber-soft);color:var(--amber);font-weight:700}
.tag.bad{background:var(--red-soft);color:var(--red);font-weight:700}
.tag.star{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.good{background:#1e2e4d;color:#93c5fd}:root:not([data-theme="light"]) .tag.star{background:#3a2e10;color:#fcd34d}}
.act{padding:11px 12px 11px 4px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:120px}
.cost{text-align:right;line-height:1.05}
.cost b{font:700 22px/1 "Barlow Condensed",sans-serif}
.cost small{display:block;font-size:12px;color:var(--muted)}
.btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.book{background:var(--line);color:var(--line-ink);text-decoration:none;font-weight:700;font-size:13.5px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.book.cp{background:#2563eb;color:#fff}
.mapit{border:1.5px solid var(--rule);background:var(--card);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
details.more{grid-column:2/-1;padding:0 12px 10px;font-size:14px;color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;font-size:13px}
details.more p{margin:5px 0}
@media (max-width:560px){
  .cls{grid-template-columns:62px minmax(0,1fr)}
  .act{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;padding:0 12px 11px;min-width:0}
  .cost{text-align:left}
  .cost b,.cost small{display:inline}
  .cost small{margin-left:4px}
}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}
.offh{font:700 22px/1.2 "Barlow Condensed",sans-serif;margin:34px 0 4px}
.off{grid-template-columns:minmax(0,1fr)}
.off .body{padding-left:16px}
.sched{font-size:14.5px;margin:8px 0 0;color:var(--ink)}
.foot{color:var(--muted);font-size:13.5px;border-top:1px solid var(--rule);padding-top:14px;margin-top:30px}
.foot p{max-width:70ch}

/* map bits */
.leaflet-popup-content{margin:12px 14px;font:14px/1.35 Barlow,system-ui,sans-serif}
.pop h4{margin:0 0 2px;font:700 16px/1.2 Barlow}
.pop .sub{color:#5d6679;margin-bottom:6px}
.pop ul{list-style:none;padding:0;margin:0 0 8px;max-height:180px;overflow:auto}
.pop li{display:flex;gap:8px;padding:2px 0}
.pop li b{min-width:52px}
.pop button{border:0;background:#141b2d;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
.legend{position:absolute;z-index:500;left:10px;bottom:10px;background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.stlabel{background:transparent;border:0;box-shadow:none;font:700 12px "Barlow Condensed",sans-serif;color:#00853f;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.stlabel::before{display:none}
#map.far .stlabel:not(.home){display:none}
.leaflet-tile-pane{filter:saturate(.75)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) saturate(.6)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) saturate(.6)}
@media (max-width:640px){.row.wrap{flex-wrap:nowrap}}
@media (max-width:900px){.legend{bottom:78px}}
@media (prefers-reduced-motion:no-preference){.chip,.hr i::after{transition:background .15s,border-color .15s,height .2s}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1><span class="bullet">2</span>Line 2 classes</h1>
    <form class="ask" id="ask" role="search">
      <input id="q" type="search" autocomplete="off" placeholder="Try “tuesday bjj after 6” or “yoga near coxwell showers”" aria-label="Describe what you want">
    </form>
    <div class="fresh" id="fresh"></div>
  </div>
</header>
<div class="app">
  <div class="side">
    <section class="panel">
      <div class="lbl">Day</div>
      <div class="row" id="days"></div>
      <hr class="sep">
      <div class="lbl"><span id="hourlbl">Time · any</span><button type="button" id="anytime" hidden>Any time</button></div>
      <div class="hours" id="hours" aria-label="Hour of day. Tap an hour, tap another to make a range, or drag."></div>
      <div class="row wrap presets" id="presets"></div>
      <hr class="sep">
      <div class="lbl"><span>Kind of class</span><button type="button" id="anycat" hidden>All kinds</button></div>
      <div class="row wrap" id="cats"></div>
      <hr class="sep">
      <details class="filters" id="filters">
        <summary>More filters</summary>
        <div class="opts">
          <label>Station <select id="station"><option value="">any</option></select></label>
          <label>Walk <select id="walk"><option value="99">any</option><option value="5">≤ 5 min</option><option value="10">≤ 10 min</option><option value="15" selected>≤ 15 min</option></select></label>
          <label>Stops from home <select id="maxstops"><option value="99">any</option><option value="3">≤ 3</option><option value="6">≤ 6</option><option value="10">≤ 10</option><option value="15">≤ 15</option></select></label>
          <label>Book via <select id="via"><option value="all">ClassPass or direct</option><option value="cp">ClassPass</option><option value="direct">Direct</option></select></label>
          <label><input type="checkbox" id="showers"> Showers only</label>
          <label><input type="checkbox" id="hidefull"> Hide full</label>
          <label>Sort <select id="sort"><option value="time">by time</option><option value="near">closest first</option><option value="cheap">cheapest first</option></select></label>
        </div>
      </details>
    </section>
    <main>
      <div class="summary" id="summary"></div>
      <div id="list"></div>
      <section id="offline" hidden>
        <h2 class="offh">Also nearby, no live schedule online</h2>
        <p class="summary">These places match your filters but don’t publish a bookable schedule we can read. Their usual times are below; check with them before going.</p>
        <div id="offlist"></div>
      </section>
      <div class="foot" id="foot"></div>
    </main>
  </div>
  <aside class="mapcol" aria-label="Map">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
  </aside>
</div>
<button class="viewbtn" id="viewbtn" type="button">🗺️ Map</button>
<script>
const $ = s => document.querySelector(s);
const TZ = 'America/Toronto';
const H0 = 5, H1 = 23; // hour picker covers 5am..10pm; the ends stretch to midnight
const PRESETS = [['Before work', 5, 9], ['Morning', 6, 12], ['Lunch', 11, 14], ['Afternoon', 12, 17], ['After work', 17, 20], ['Evening', 18, 23]];
const CATS = [
  ['crossfit', 'CrossFit', '#f97316', '🏋️'], ['bjj', 'Jiu-jitsu', '#4f46e5', '🥋'], ['martial', 'Muay Thai, MMA & boxing', '#dc2626', '🥊'],
  ['yoga', 'Yoga', '#9333ea', '🧘'], ['hot-yoga', 'Hot yoga', '#ea580c', '🔥'], ['pilates', 'Pilates & reformer', '#db2777', '🤸'],
  ['barre', 'Barre', '#c026d3', '🩰'], ['spin', 'Spin', '#0284c7', '🚴'], ['hiit', 'HIIT & bootcamp', '#d97706', '⚡'],
  ['strength', 'Strength', '#16a34a', '💪'], ['climbing', 'Climbing', '#a16207', '🧗'], ['dance', 'Dance', '#e11d48', '💃'],
  ['community', 'Community centres', '#0d9488', '🏛️'], ['other', 'Other', '#64748b', '✨'],
];
const CAT = Object.fromEntries(CATS.map(x => [x[0], x]));
const state = { day: null, from: null, to: null, cats: new Set(), station: null, venue: null, showers: false, via: 'all', walk: 15, maxstops: 99, hidefull: false, sort: 'time' };
let D, byDay = new Map();

const fmtTime = t => new Date(t * 1000).toLocaleTimeString('en-CA', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).replace(' a.m.', 'am').replace(' p.m.', 'pm').replace(':00', '');
const dayKey = t => new Date(t * 1000).toLocaleDateString('en-CA', { timeZone: TZ });
const hourOf = t => Number(new Date(t * 1000).toLocaleString('en-CA', { timeZone: TZ, hour: 'numeric', hourCycle: 'h23' }));
const fmtH = h => h === 0 || h === 24 ? 'midnight' : h === 12 ? 'noon' : (h % 12) + (h < 12 ? 'am' : 'pm');
const money = n => n == null ? null : '$' + (Math.round(n * 100) / 100).toFixed(n % 1 ? 2 : 0);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const catOf = (c, v) => v.city ? 'community' : CAT[c.c] ? c.c : 'other';
const toggle = (set, k) => set.has(k) ? set.delete(k) : set.add(k);
let queued = false;
const render = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; draw(); }); } };

fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { D = d; init(); }).catch(e => {
  $('#list').innerHTML = `<div class="empty">Couldn’t load the class data (${esc(e.message)}). Reload the page to try again.</div>`;
});

function init() {
  for (const c of D.classes) { const k = dayKey(c.s); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(c); }
  $('#fresh').textContent = 'Updated ' + new Date(D.generatedAt).toLocaleString('en-CA', { timeZone: TZ, weekday: 'short', hour: 'numeric', minute: '2-digit' });
  // days
  const today = dayKey(Date.now() / 1000);
  const days = [...byDay.keys()].filter(k => k >= today).sort();
  state.day = days[0];
  $('#days').innerHTML = days.map((k, i) => { const d = new Date(k + 'T12:00:00');
    return `<button class="chip day" data-day="${k}"><b>${i === 0 && k === today ? 'Today' : d.toLocaleDateString('en-CA', { weekday: 'short' })}</b><small>${d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })}</small></button>`; }).join('');
  $('#days').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) { state.day = b.dataset.day; state.venue = null; render(); } });
  // hours
  const hrs = []; for (let h = H0; h < H1; h++) hrs.push(h);
  $('#hours').innerHTML = hrs.map(h => `<button class="hr" data-h="${h}" title="${fmtH(h)}"><i></i><span>${h % 12 || 12}${h < 12 ? 'a' : 'p'}</span></button>`).join('');
  hourPicker();
  $('#presets').innerHTML = PRESETS.map(([l, a, b], i) => `<button class="chip" data-p="${i}">${l} <small>${fmtH(a)}–${fmtH(b)}</small></button>`).join('');
  $('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; const [, a, z] = PRESETS[b.dataset.p];
    if (state.from === a && state.to === z) state.from = state.to = null; else { state.from = a; state.to = z; } render(); });
  $('#anytime').onclick = () => { state.from = state.to = null; render(); };
  // kinds
  const present = new Set(D.classes.map(c => CAT[c.c] ? c.c : 'other')); if (Object.values(D.venues).some(v => v.city)) present.add('community');
  $('#cats').innerHTML = CATS.filter(([k]) => present.has(k)).map(([k, l, col, em]) => `<button class="chip cat" data-c="${k}" style="--c:${col}"><span class="dot"></span>${em} ${l}</button>`).join('');
  $('#cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { toggle(state.cats, b.dataset.c); render(); } });
  $('#anycat').onclick = () => { state.cats.clear(); render(); };
  // more filters
  $('#station').innerHTML += D.stations.filter(s => s.count).map(s => `<option>${esc(s.name)}</option>`).join('');
  $('#station').addEventListener('change', e => { state.station = e.target.value || null; state.venue = null; render(); flyToStation(); });
  for (const id of ['showers', 'hidefull']) $('#' + id).addEventListener('change', e => { state[id] = e.target.checked; render(); });
  for (const id of ['via', 'walk', 'maxstops', 'sort']) $('#' + id).addEventListener('change', e => { state[id] = isNaN(+e.target.value) ? e.target.value : +e.target.value; render(); });
  $('#ask').addEventListener('submit', e => { e.preventDefault(); parse($('#q').value); });
  $('#q').addEventListener('input', e => parse(e.target.value, true));
  // list interactions
  document.addEventListener('click', e => {
    const x = e.target.closest('[data-clear]'); if (x) { const k = x.dataset.clear; if (k === 'all') clearAll(); else state[k] = null; render(); return; }
    const st = e.target.closest('[data-st]'); if (st) { state.station = state.station === st.dataset.st ? null : st.dataset.st; state.venue = null; render(); flyToStation(); return; }
    const m = e.target.closest('[data-map]'); if (m) { showVenue(m.dataset.map); return; }
    const only = e.target.closest('[data-only]'); if (only) { state.venue = only.dataset.only; map.closePopup(); setMapView(false); render(); scrollTo({ top: 0, behavior: 'smooth' }); }
  }, true); // capture: Leaflet stops clicks from leaving popups
  $('#viewbtn').onclick = () => setMapView(!document.body.classList.contains('showmap'));
  $('#foot').innerHTML = D.footnote;
  const saved = (() => { try { return JSON.parse(localStorage.getItem('l2c') || 'null'); } catch { return null; } })();
  if (saved) { state.showers = !!saved.showers; state.walk = saved.walk ?? 15; state.maxstops = saved.maxstops ?? 99; state.via = saved.via || 'all'; }
  initMap();
  draw();
}

function hourPicker() {
  const el = $('#hours'); let drag = null;
  const at = e => document.elementFromPoint(e.clientX, e.clientY)?.closest('.hr');
  el.addEventListener('pointerdown', e => { const b = e.target.closest('.hr'); if (!b) return; e.preventDefault(); drag = { a: +b.dataset.h, moved: false }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (!drag) return; const b = at(e); if (!b) return; const h = +b.dataset.h;
    if (h !== drag.a || drag.moved) { drag.moved = true; state.from = Math.min(drag.a, h); state.to = Math.max(drag.a, h) + 1; render(); } });
  el.addEventListener('pointerup', () => { if (!drag) return; if (!drag.moved) tapHour(drag.a); drag = null; });
  el.addEventListener('pointercancel', () => { drag = null; });
  el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.hr')) { e.preventDefault(); tapHour(+e.target.closest('.hr').dataset.h); } });
}
// tap one hour to pick it, tap another to stretch to a range, tap a lone hour again to clear
function tapHour(h) {
  const single = state.from != null && state.to - state.from === 1;
  if (single && state.from === h) state.from = state.to = null;
  else if (single) { state.from = Math.min(state.from, h); state.to = Math.max(state.from, h) + 1; }
  else { state.from = h; state.to = h + 1; }
  render();
}
const inTime = h => state.from == null || (h >= (state.from <= H0 ? 0 : state.from) && h < (state.to >= H1 ? 24 : state.to));

// "tuesday morning bjj", "crossfit after 5 near coxwell with showers"
function parse(q, live) {
  const t = q.toLowerCase();
  const wd = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const days = [...byDay.keys()].sort();
  const m = t.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/);
  if (/\btoday\b|\btonight\b/.test(t)) state.day = days[0];
  else if (/\btomorrow\b/.test(t)) state.day = days[1] || days[0];
  else if (m) state.day = days.find(k => new Date(k + 'T12:00:00').getDay() === wd.indexOf(m[1])) || state.day;
  let from = null, to = null;
  const span = (a, b) => { from = from == null ? a : Math.min(from, a); to = to == null ? b : Math.max(to, b); };
  if (/\bearly\b|before work|sunrise/.test(t)) span(5, 8);
  if (/\bmorning/.test(t)) span(5, 12);
  if (/lunch|midday|noon/.test(t)) span(11, 14);
  if (/afternoon/.test(t)) span(12, 17);
  if (/evening|after work|tonight/.test(t)) span(17, 21);
  if (/\blate\b|night/.test(t)) span(20, 24);
  const after = t.match(/after (\d{1,2})\s*(am|pm)?/), before = t.match(/before (\d{1,2})\s*(am|pm)?/);
  const h24 = (n, ap) => ap === 'pm' && n < 12 ? n + 12 : ap === 'am' ? n % 12 : n <= 9 ? n + 12 : n;
  if (after) { from = h24(+after[1], after[2]); to = to && to > from ? to : 24; }
  if (before) { to = h24(+before[1], before[2]); from = from != null && from < to ? from : H0; }
  if (from != null || !live) { state.from = from; state.to = to; }
  const cats = new Set();
  const words = { crossfit: /crossfit|wod/, bjj: /bjj|jiu|jitsu|grappl|no-?gi/, martial: /muay|thai|mma|box|kick|martial|karate|judo|wrestl/, 'hot-yoga': /hot yoga|hot/, yoga: /yoga|vinyasa|yin/, pilates: /pilates|reformer/, barre: /barre/, spin: /spin|cycl|ride/, hiit: /hiit|bootcamp|circuit/, strength: /strength|lift|weights/, climbing: /climb|boulder/, dance: /dance|zumba/, community: /community|city/ };
  for (const [k, re] of Object.entries(words)) if (re.test(t)) cats.add(k);
  if (cats.has('hot-yoga') && !/yoga/.test(t)) cats.delete('hot-yoga');
  if (cats.has('hot-yoga')) cats.delete('yoga');
  if (cats.size || !live) state.cats = cats;
  if (/shower/.test(t)) state.showers = true;
  if (/classpass/.test(t)) state.via = 'cp';
  if (/direct|drop.?in/.test(t)) state.via = 'direct';
  const st = D.stations.find(s => t.includes(s.name.toLowerCase()));
  if (st && st.name !== state.station) { state.station = st.name; flyToStation(); }
  if (/near|close|closest/.test(t) && !st) state.sort = 'near';
  if (/cheap/.test(t)) state.sort = 'cheap';
  render();
}

function passes(c, v) {
  if (state.cats.size && !state.cats.has(catOf(c, v)) && !(state.cats.has('yoga') && c.c === 'hot-yoga') && !(state.cats.has(c.c))) return false;
  if (state.station && v.station !== state.station) return false;
  if (state.showers && v.showers.v !== 'yes') return false;
  if (state.via === 'cp' && !c.cp) return false;
  if (state.via === 'direct' && !c.direct) return false;
  if (v.walkMin > state.walk && !state.station) return false;
  if (v.stops > state.maxstops) return false;
  if (state.hidefull && (c.st === 'full' || c.st === 'waitlist')) return false;
  return true;
}
const cost = (c, v) => Math.min(...[c.price ?? v.price?.dropIn, c.cp ? ((c.cr ?? c.crEst?.[0] ?? v.cp?.credits?.[0]) ?? 99) * D.creditValue : null].filter(x => x != null), 999);
function clearAll() { Object.assign(state, { from: null, to: null, cats: new Set(), station: null, venue: null, showers: false, via: 'all', walk: 15, maxstops: 99, hidefull: false }); $('#q').value = ''; }

function draw() {
  try { localStorage.setItem('l2c', JSON.stringify({ showers: state.showers, walk: state.walk, maxstops: state.maxstops, via: state.via })); } catch {}
  document.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', b.dataset.day === state.day));
  document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', state.cats.has(b.dataset.c)));
  document.querySelectorAll('[data-p]').forEach(b => { const [, a, z] = PRESETS[b.dataset.p]; b.setAttribute('aria-pressed', state.from === a && state.to === z); });
  $('#showers').checked = state.showers; $('#hidefull').checked = state.hidefull;
  $('#via').value = state.via; $('#walk').value = state.walk; $('#maxstops').value = state.maxstops; $('#sort').value = state.sort; $('#station').value = state.station || '';
  $('#anycat').hidden = !state.cats.size; $('#anytime').hidden = state.from == null;
  $('#hourlbl').textContent = state.from == null ? 'Time · any (tap or drag the hours)' : `Time · ${fmtH(state.from <= H0 ? 0 : state.from)} – ${fmtH(state.to >= H1 ? 24 : state.to)}`;

  const now = Date.now() / 1000 - 600;
  const base = (byDay.get(state.day) || []).filter(c => c.s > now).map(c => [c, D.venues[c.v]]).filter(([c, v]) => v && passes(c, v));
  // hour bars show what the other filters leave, so you can see where the classes are
  const counts = {}; for (const [c] of base) { const h = Math.min(Math.max(hourOf(c.s), H0), H1 - 1); counts[h] = (counts[h] || 0) + 1; }
  const peak = Math.max(1, ...Object.values(counts));
  document.querySelectorAll('.hr').forEach(b => { const h = +b.dataset.h; b.style.setProperty('--h', Math.round(100 * (counts[h] || 0) / peak) + '%');
    b.classList.toggle('on', state.from != null && h >= state.from && h < state.to); b.title = `${fmtH(h)}: ${counts[h] || 0} classes`; });

  const timed = base.filter(([c]) => inTime(hourOf(c.s)));
  const rows = state.venue ? timed.filter(([c]) => c.v === state.venue) : timed;
  if (state.sort === 'near') rows.sort((a, b) => (a[1].tripMin - b[1].tripMin) || (a[0].s - b[0].s));
  else if (state.sort === 'cheap') rows.sort((a, b) => (cost(...a) - cost(...b)) || (a[0].s - b[0].s));
  else rows.sort((a, b) => (a[0].s - b[0].s) || (a[1].tripMin - b[1].tripMin));

  const d = new Date(state.day + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
  const venuesN = new Set(rows.map(([c]) => c.v)).size;
  const act = [state.station && `<span class="active">📍 ${esc(state.station)}<button data-clear="station" aria-label="Clear station">✕</button></span>`,
    state.venue && `<span class="active">${esc(D.venues[state.venue]?.name)}<button data-clear="venue" aria-label="Show all places">✕</button></span>`].filter(Boolean).join('');
  $('#summary').innerHTML = `<span><b>${rows.length} class${rows.length === 1 ? '' : 'es'}</b> at ${venuesN} place${venuesN === 1 ? '' : 's'} · ${d}</span>${act}`;
  $('#viewbtn').textContent = document.body.classList.contains('showmap') ? '☰ List' : `🗺️ Map · ${venuesN}`;

  renderOffline();
  drawMap(timed);
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty">Nothing matches. Try another time, a longer walk, or clear the filters.<br><button class="chip" data-clear="all">Clear filters</button></div>`;
    return;
  }
  let html = '', last = null;
  for (const [c, v] of rows.slice(0, 400)) {
    if (state.sort === 'time') { const h = hourOf(c.s); if (h !== last) { const n = rows.filter(([x]) => hourOf(x.s) === h).length; html += `<div class="hh">${fmtH(h)}<small>${n} class${n === 1 ? '' : 'es'}</small></div>`; last = h; } }
    html += card(c, v);
  }
  if (rows.length > 400) html += `<p class="summary">Showing the first 400. Narrow by time or kind to see the rest.</p>`;
  $('#list').innerHTML = html;
}

function offlineVenues() {
  return Object.entries(D.venues).filter(([, v]) => v.noSchedule
    && (!state.cats.size || v.cats.some(c => state.cats.has(c) || (state.cats.has('yoga') && c === 'hot-yoga')))
    && (!state.station || v.station === state.station) && (state.station || v.walkMin <= state.walk)
    && v.stops <= state.maxstops && (!state.showers || v.showers.v === 'yes') && state.via !== 'cp')
    .sort((a, b) => a[1].tripMin - b[1].tripMin).slice(0, 40);
}
function renderOffline() {
  const list = offlineVenues();
  $('#offline').hidden = !list.length || !state.cats.size && !state.station || !!state.venue;
  $('#offlist').innerHTML = list.map(([id, v]) => { const k = CAT[v.cats[0]] || CAT.other; return `<article class="cls off" style="--c:${k[2]}"><div class="body">
    <div class="kind">${k[3]} ${esc(k[1])}</div>
    <h3><a href="${esc(v.website || '#')}" target="_blank" rel="noopener">${esc(v.name)}</a></h3>
    <div class="meta" style="margin-top:6px"><button class="pill" data-st="${esc(v.station)}"><i></i>${esc(v.station)}</button><span>🚶 <b>${v.walkMin} min</b></span><span>${v.stops ? v.stops + ' stops · ~' + v.tripMin + ' min trip' : 'your station'}</span><button class="mapit" data-map="${esc(id)}">📍 Map</button></div>
    ${v.schedule ? `<p class="sched">${esc(v.schedule)}</p>` : ''}
    <div class="tags">${v.showers.v === 'yes' ? '<span class="tag good">🚿 Showers</span>' : v.showers.v === 'no' ? '<span class="tag">No showers</span>' : ''}${v.price?.dropIn ? `<span class="tag">${money(v.price.dropIn)} drop-in</span>` : ''}${v.price?.intro ? `<span class="tag">${esc(v.price.intro)}</span>` : ''}</div>
  </div></article>`; }).join('');
}

function card(c, v) {
  const k = CAT[catOf(c, v)];
  const mins = Math.round((c.e - c.s) / 60);
  const [, hm, ap] = fmtTime(c.s).match(/^(.*?)(am|pm)?$/);
  const status = c.st === 'full' ? '<span class="tag bad">Full</span>' : c.st === 'waitlist' ? '<span class="tag warn">Waitlist</span>'
    : c.sp != null && c.sp <= 3 ? `<span class="tag warn">🔥 ${c.sp} spot${c.sp === 1 ? '' : 's'} left</span>` : c.sp != null ? `<span class="tag">${c.sp} spots left</span>` : '';
  const sh = v.showers.v === 'yes' ? '<span class="tag good">🚿 Showers</span>' : v.showers.v === 'no' ? '<span class="tag">No showers</span>' : '';
  const ride = v.stops === 0 ? 'your station' : `${v.stops} stop${v.stops === 1 ? '' : 's'} · ~${v.tripMin} min trip`;
  const p = c.price ?? v.price?.dropIn;
  const cr = c.cp ? (c.cr != null ? [c.cr, c.cr] : c.crEst || v.cp?.credits) : null;
  const crTxt = cr ? (cr[0] === cr[1] ? `${cr[0]} cr` : `${cr[0]}–${cr[1]} cr`) : null;
  const costHtml = p != null ? `<b>${p === 0 ? 'Free' : money(p)}</b><small>drop-in${crTxt ? ' · or ' + crTxt : ''}</small>`
    : cr ? `<b>${crTxt}</b><small>≈ ${money(cr[0] * D.creditValue)}${cr[1] !== cr[0] ? '–' + money(cr[1] * D.creditValue) : ''} ClassPass</small>`
    : `<small>price on site</small>`;
  const btns = [(c.direct || !c.cp) && (c.u || v.bookUrl) && `<a class="book" href="${esc(c.u || v.bookUrl)}" target="_blank" rel="noopener">Book</a>`,
    c.cp && v.cp?.url && `<a class="book cp" href="${esc(v.cp.url)}" target="_blank" rel="noopener">ClassPass</a>`].filter(Boolean).join('');
  const more = [v.price?.intro && `New here: ${esc(v.price.intro)}`, v.price?.pack && `Packs: ${esc(v.price.pack)}`, v.price?.unlimited && `Unlimited: ${esc(v.price.unlimited)}`, v.price?.note && esc(v.price.note),
    cr && `ClassPass: ${crTxt}${c.cr != null ? '' : c.crRep ? ' (range members report here)' : ' (typical for this kind of class)'}`,
    v.showers.note && `Showers: ${esc(v.showers.note)}`, v.showers.v !== 'yes' && v.showers.v !== 'no' && 'Showers: unknown', v.notes && esc(v.notes), v.address && esc(v.address),
    c.i && `Instructor: ${esc(c.i)}`].filter(Boolean);
  return `<article class="cls${state.venue === c.v ? ' sel' : ''}" style="--c:${k[2]}">
    <div class="when"><b>${hm}</b><small>${ap || ''}${mins > 0 ? ' · ' + mins + 'm' : ''}</small></div>
    <div class="body">
      <div class="kind">${k[3]} ${esc(k[1])}</div>
      <h3>${esc(c.n)}</h3>
      <div class="venue"><a href="${esc(v.website || v.cp?.url || '#')}" target="_blank" rel="noopener">${esc(v.name)}</a></div>
      <div class="meta"><button class="pill" data-st="${esc(v.station)}" title="Only ${esc(v.station)}"><i></i>${esc(v.station)}</button><span>🚶 <b>${v.walkMin} min</b></span><span>${ride}</span></div>
      <div class="tags">${status}${sh}${v.rating ? `<span class="tag star">★ ${v.rating.toFixed(1)}</span>` : ''}${c.lvl && !/open/i.test(c.lvl) ? `<span class="tag">${esc(c.lvl)}</span>` : ''}${v.price?.intro ? '<span class="tag good">Intro offer</span>' : ''}</div>
    </div>
    <div class="act"><div class="cost">${costHtml}</div><div class="btns">${btns}<button class="mapit" data-map="${esc(c.v)}" title="Show on map">📍</button></div></div>
    ${more.length ? `<details class="more"><summary>Details</summary>${more.map(m => `<p>${m}</p>`).join('')}</details>` : ''}
  </article>`;
}

// ---- map ----
let map, venueLayer, markers = {}, lastTimed = [];
function initMap() {
  if (!window.L) { $('#map').innerHTML = '<p class="empty">Map couldn’t load.</p>'; return; }
  map = L.map('map', { zoomControl: true }).setView([43.675, -79.40], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  const labels = () => $('#map').classList.toggle('far', map.getZoom() < 14);
  map.on('zoomend', labels); labels();
  const st = D.stations.filter(s => s.lat != null);
  if (st.length) {
    L.polyline(st.map(s => [s.lat, s.lon]), { color: '#00853f', weight: 7, opacity: .85 }).addTo(map);
    for (const s of st) {
      L.circleMarker([s.lat, s.lon], { radius: s.home ? 8 : 5, color: '#00853f', weight: 3, fillColor: s.home ? '#00853f' : '#fff', fillOpacity: 1 })
        .bindTooltip(s.name + (s.home ? ' (home)' : ''), { permanent: true, direction: 'top', className: 'stlabel' + (s.home ? ' home' : ''), offset: [0, -6] })
        .on('click', () => { state.station = state.station === s.name ? null : s.name; state.venue = null; render(); flyToStation(); }).addTo(map);
    }
    map.fitBounds(L.latLngBounds(st.map(s => [s.lat, s.lon])).pad(.05));
  }
  venueLayer = L.layerGroup().addTo(map);
  $('#legend').innerHTML = CATS.filter(([k]) => $(`.cat[data-c="${k}"]`)).map(([, l, col]) => `<span><i style="background:${col}"></i>${esc(l.replace(/ &.*|, .*| centres/, '').replace('Muay Thai', 'Martial arts'))}</span>`).join('');
}
function flyToStation() {
  if (!map) return;
  const s = D.stations.find(x => x.name === state.station);
  if (s?.lat != null) map.flyTo([s.lat, s.lon], 15, { duration: .6 });
}
function drawMap(timed) {
  if (!map) return;
  lastTimed = timed;
  const by = new Map();
  for (const [c, v] of timed) { if (!by.has(c.v)) by.set(c.v, { v, list: [], cats: {} }); const g = by.get(c.v); g.list.push(c); const k = catOf(c, v); g.cats[k] = (g.cats[k] || 0) + 1; }
  venueLayer.clearLayers(); markers = {};
  for (const [id, g] of by) {
    if (g.v.lat == null) continue;
    const top = Object.entries(g.cats).sort((a, b) => b[1] - a[1])[0][0];
    const sel = state.venue === id;
    markers[id] = L.circleMarker([g.v.lat, g.v.lon], { radius: Math.min(6 + Math.sqrt(g.list.length) * 2, 16) + (sel ? 3 : 0), color: sel ? '#141b2d' : '#fff', weight: sel ? 3 : 2, fillColor: CAT[top][2], fillOpacity: .92 })
      .bindPopup(() => popup(id, g.v, g.list), { maxWidth: 280 }).bindTooltip(`${g.v.name} · ${g.list.length}`, { direction: 'top' }).addTo(venueLayer);
  }
  for (const [id, v] of offlineVenues()) {
    if (v.lat == null || markers[id]) continue;
    markers[id] = L.circleMarker([v.lat, v.lon], { radius: 5, color: '#64748b', weight: 2, fillColor: '#fff', fillOpacity: 1, dashArray: '2 2' })
      .bindPopup(() => popup(id, v, []), { maxWidth: 280 }).bindTooltip(`${v.name} · no live schedule`, { direction: 'top' }).addTo(venueLayer);
  }
}
function popup(id, v, list) {
  const items = list.slice().sort((a, b) => a.s - b.s).slice(0, 12).map(c => `<li><b>${fmtTime(c.s)}</b><span>${CAT[catOf(c, v)][3]} ${esc(c.n)}</span></li>`).join('');
  return `<div class="pop"><h4>${esc(v.name)}</h4><div class="sub">🚇 ${esc(v.station)} · 🚶 ${v.walkMin} min${v.showers.v === 'yes' ? ' · 🚿' : ''}</div>
    ${list.length ? `<ul>${items}</ul>${list.length > 12 ? `<div class="sub">+${list.length - 12} more</div>` : ''}<button data-only="${esc(id)}">Show ${list.length} class${list.length === 1 ? '' : 'es'} →</button>`
      : `<div class="sub">${esc(v.schedule || 'No live schedule online.')}</div>${v.website ? `<a href="${esc(v.website)}" target="_blank" rel="noopener">Website</a>` : ''}`}</div>`;
}
function setMapView(on) {
  document.body.classList.toggle('showmap', on);
  if (map) setTimeout(() => map.invalidateSize(), 30);
  render();
}
function showVenue(id) {
  if (!map) return;
  if (matchMedia('(max-width:900px)').matches) setMapView(true);
  const v = D.venues[id];
  setTimeout(() => { map.invalidateSize(); map.setView([v.lat, v.lon], Math.max(map.getZoom(), 15)); markers[id]?.openPopup(); }, 60);
}
</script>
</body>
</html>
